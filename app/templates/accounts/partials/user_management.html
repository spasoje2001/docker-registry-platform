<!-- Search -->
<form method="get" class="mb-4">
    <input type="hidden" name="section" value="users">
    <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input
            type="text"
            class="form-control"
            name="q"
            value="{{ q }}"
            placeholder="Search by username or email..."
        >
        <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Search</button>
    {% if q %}
    <div class="col-md-1"></div>
    <div class="col-md-1 d-flex align-items-end">
        <a href="{% url 'accounts:admin_panel' %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>Clear
        </a>
    </div>
    {% endif %}
    </div>
    {% if q %}
        <div class="form-text">
            Showing results for: <b>{{ q }}</b>
        </div>
    {% endif %}

</form>

<!-- Users table -->
<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Username</th>
                        <th>Email</th>
                        <th>Joined</th>
                        <th>Verified Publisher</th>
                        <th>Sponsored OSS</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td class="ps-3 fw-semibold">
                            {{ u.username }}
                        </td>
                        <td>{{ u.email }}</td>
                        <td class="text-muted">
                            {{ u.date_joined|date:"M d, Y" }}
                        </td>

                        <td>
                            <form method="post" action="{% url 'accounts:update_badges' u.id %}">
                                {% csrf_token %}
                                <input type="hidden" name="badge" value="is_verified_publisher">

                                <div class="form-check form-switch m-0">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="value"
                                        value="true"
                                        onchange="this.form.submit()"
                                        {% if u.is_verified_publisher %}checked{% endif %}
                                    >
                                    <label class="form-check-label">Verified</label>
                                </div>
                            </form>
                        </td>

                       <td>
                            <form method="post" action="{% url 'accounts:update_badges' u.id %}">
                                {% csrf_token %}
                                <input type="hidden" name="badge" value="is_sponsored_oss">

                                <div class="form-check form-switch m-0">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="value"
                                        value="true"
                                        onchange="this.form.submit()"
                                        {% if u.is_sponsored_oss %}checked{% endif %}
                                    >
                                    <label class="form-check-label">Sponsored</label>
                                </div>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                            No users found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
