<!-- Refresh Logs Button -->
<button type="button" class="btn btn-outline-secondary" id="refreshLogsBtn">
    <span id="refreshBtnContent">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh Logs
    </span>
    <span id="refreshBtnLoading" class="d-none">
        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        Indexing...
    </span>
</button>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const refreshBtn = document.getElementById('refreshLogsBtn');
    const btnContent = document.getElementById('refreshBtnContent');
    const btnLoading = document.getElementById('refreshBtnLoading');

    refreshBtn.addEventListener('click', async function() {
        // Disable button and show loading state
        refreshBtn.disabled = true;
        btnContent.classList.add('d-none');
        btnLoading.classList.remove('d-none');

        try {
            const response = await fetch('{% url "analytics:refresh_logs" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            if (data.success) {
                // Show success message
                showToast('success', data.message);

                // Reload the page to show new logs (with newest first)
                setTimeout(() => {
                    // Reset to page 1 and newest first
                    const url = new URL(window.location.href);
                    url.searchParams.set('page', '1');
                    url.searchParams.set('sort_order', 'desc');
                    window.location.href = url.toString();
                }, 1000);
            } else {
                showToast('error', data.error || 'Failed to refresh logs');
                resetButton();
            }
        } catch (error) {
            console.error('Error refreshing logs:', error);
            showToast('error', 'Failed to connect to server');
            resetButton();
        }
    });

    function resetButton() {
        refreshBtn.disabled = false;
        btnContent.classList.remove('d-none');
        btnLoading.classList.add('d-none');
    }

    function showToast(type, message) {
        // Create toast element
        const toastContainer = document.getElementById('toastContainer') || createToastContainer();

        const toastId = 'toast-' + Date.now();
        const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
        const iconClass = type === 'success' ? 'bi-check-circle' : 'bi-exclamation-circle';

        const toastHtml = `
            <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi ${iconClass} me-2"></i>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        `;

        toastContainer.insertAdjacentHTML('beforeend', toastHtml);

        const toastElement = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
        toast.show();

        // Remove from DOM after hidden
        toastElement.addEventListener('hidden.bs.toast', () => {
            toastElement.remove();
        });
    }

    function createToastContainer() {
        const container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container position-fixed top-0 end-0 p-3';
        container.style.zIndex = '1100';
        document.body.appendChild(container);
        return container;
    }
});
</script>
